[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grail-scrna"
version = "0.1.0"
description = "Endpoint-conditioned single-cell expression interpolation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2.1,<3", "scikit-learn>=1.4,<2",
  "torch>=2.5,<3", "anndata>=0.11,<0.13", "scanpy>=1.11,<1.12", "matplotlib>=3.7,<4"
]
[project.optional-dependencies]
docs = ["mkdocs-material>=9,<10"]
[project.scripts]
grail = "grail.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
