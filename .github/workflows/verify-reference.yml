name: Verify the published GRAIL reference
on:
  push:
    branches: [publication/stage-v0.1.0-reference-a7f10d2]
    paths:
      - .github/workflows/verify-reference.yml
      - scripts/replay_table7.py
      - results/embryoid_body/table7_reference.tex

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: 2
      OMP_NUM_THREADS: 2
      NUMBA_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ece9fcdcca865ab500b3f7f96ca7aeebfa056204
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare the published ZIP with the tagged files and data manifest
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/sumantaray/GRAIL/archive/refs/tags/v0.1.0-reference.zip \
            --output "$RUNNER_TEMP/grail.zip"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from zipfile import ZipFile

          files = set(subprocess.check_output(["git", "ls-files", "-z"]).decode().rstrip("\0").split("\0"))
          with ZipFile(Path(os.environ["RUNNER_TEMP"]) / "grail.zip") as archive:
              entries = {entry.filename.split("/", 1)[1]: entry for entry in archive.infolist() if not entry.is_dir()}
              assert set(entries) == files, "ZIP and Git list different files"
              for name, entry in entries.items():
                  with archive.open(entry) as packed, Path(name).open("rb") as tracked:
                      assert hashlib.file_digest(packed, "sha256").digest() == hashlib.file_digest(tracked, "sha256").digest(), name
          counts = Path("datasets/embryoid_body")
          parts = json.loads((counts / "manifest.json").read_text())["parts"]
          for part in parts:
              with (counts / part["file"]).open("rb") as source:
                  assert hashlib.file_digest(source, "sha256").hexdigest() == part["sha256"], part["file"]
          print(f"Verified {len(files)} archived files and {len(parts)} data-part checksums.")
          PY
      - name: Install the reference CPU environment
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install -c requirements-tested.txt -e .
      - name: Run the regression tests and the 480-cell example
        run: |
          python -m unittest discover -s tests -v
          python scripts/directional_check.py
          grail run --data datasets/example/eb_480.h5ad --config configs/quick.json --out runs/example --seed 42 --save-observed
          python scripts/plot_joint.py runs/example/lsh/seed-42
          test -s runs/example/lsh/seed-42/joint_umap.png
      - name: Replay both generators and check the expression matrices
        run: |
          grail generate --run runs/example/lsh/seed-42 --times 0 0.25 0.5 0.75 1 --out runs/demo-replayed.h5ad
          grail generate --run results/embryoid_body/seed-42-generator --times 0 0.25 0.5 0.75 1 --out runs/reference-replayed.h5ad
          python - <<'PY'
          import anndata as ad
          import numpy as np

          demo = ad.read_h5ad("runs/example/lsh/seed-42/generated.h5ad")
          replay = ad.read_h5ad("runs/demo-replayed.h5ad")
          assert demo.obs_names.equals(replay.obs_names) and demo.var_names.equals(replay.var_names)
          np.testing.assert_allclose(demo.X, replay.X, rtol=1e-5, atol=1e-6)
          reference = ad.read_h5ad("runs/reference-replayed.h5ad")
          assert reference.shape == (1000, 2000) and np.isfinite(reference.X).all()
          counts = reference.obs.groupby("t", observed=True).size().to_dict()
          assert counts == {t: 200 for t in (0, 0.25, 0.5, 0.75, 1)}, counts
          print(f"Example replay matched. Reference checkpoint generated {reference.shape[0]} profiles across {reference.shape[1]} genes.")
          PY
      - name: Replay the Table 7 controls in the two distance spaces
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:scripts/replay_table7.py" > scripts/replay_table7.py
          python scripts/replay_table7.py runs/reference-replayed.h5ad --out "$RUNNER_TEMP/table7-seed42.csv"
          cat "$RUNNER_TEMP/table7-seed42.csv"
      - name: Compile the measured embryoid-body table
        run: |
          git show "$GITHUB_SHA:results/embryoid_body/table7_reference.tex" > "$RUNNER_TEMP/table7_reference.tex"
          if ! command -v pdflatex >/dev/null; then
            sudo apt-get -qq update
            sudo apt-get -qq install -y --no-install-recommends texlive-latex-base
          fi
          cd "$RUNNER_TEMP"
          cat > table7-check.tex <<'TEX'
          \documentclass{article}
          \begin{document}
          \input{table7_reference}
          \end{document}
          TEX
          pdflatex -halt-on-error -interaction=nonstopmode table7-check.tex
          if grep -F 'Overfull \hbox' table7-check.log; then exit 1; fi
